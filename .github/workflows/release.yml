# Build a Foundry-installable module.zip and attach it (with module.json) to a
# GitHub Release. Runs on the GitHub runner — no local upload bandwidth needed.
#
# Triggers:
#   - release:published  — normal flow. Publish a release in the web UI; this
#     workflow fires automatically and attaches the assets.
#   - workflow_dispatch  — manual rerun against an existing tag. Useful if the
#     normal trigger missed an event (e.g. publish happened during a deploy)
#     or if you need to re-package a fix without bumping the version.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)attach assets to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository at target tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      # PMTiles is gitignored; pull the canonical Golarion build from the wiki.
      - name: Fetch Golarion PMTiles
        run: |
          mkdir -p lib/pathfinder-wiki-maps/data
          curl -fL --retry 3 --retry-delay 5 \
            https://map.pathfinderwiki.com/data/golarion.pmtiles \
            -o lib/pathfinder-wiki-maps/data/golarion.pmtiles
          ls -lh lib/pathfinder-wiki-maps/data/golarion.pmtiles

      - name: Build module.zip
        run: |
          zip -r module.zip \
            module.json \
            scripts \
            styles \
            languages \
            lib \
            LICENSE \
            NOTICE.md \
            README.md
          ls -lh module.zip

      - name: Attach assets to the release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          tag: ${{ steps.target.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: 'module.json,module.zip'
